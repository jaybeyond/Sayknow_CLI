name: CI
on:
   workflow_dispatch:
      inputs:
         rehearsal:
            description: "Reproduce release digests without publishing"
            required: true
            type: choice
            options: [tag-build-verify, main-nontag]
permissions:
   contents: read
   actions: read
jobs:
   reproduce-release-digests:
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
           with:
              ref: 4facd750b88e804faad50d0825bc1be87311ada1
              persist-credentials: false
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
           with:
              node-version: "24"
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
           with:
              bun-version: "1.3.14"
         - run: bun install --frozen-lockfile
         - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
           with:
              pattern: pi-natives-*
              path: packages/natives/native
              merge-multiple: true
              github-token: ${{ github.token }}
              run-id: 45919189448
         - run: bun scripts/ci-release-publish.ts --prepare-evidence --evidence-dir "$RUNNER_TEMP/release-evidence"
         - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
           with:
              pattern: skc-binary-*
              path: release-binaries
              merge-multiple: true
              github-token: ${{ github.token }}
              run-id: 45919189448
         - run: |
              bun scripts/release-binaries-manifest.ts --bin-dir release-binaries --tag sayknow-v0.7.28
              sha256sum release-binaries/sayknow-release-binaries.sha256 "$RUNNER_TEMP/release-evidence/sayknow-release-packages-expected-v1.json"
         - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
           with:
              name: release-evidence-digests-only
              path: |
                 release-binaries/sayknow-release-binaries.sha256
                 ${{ runner.temp }}/release-evidence/sayknow-release-packages-expected-v1.json
              if-no-files-found: error
              retention-days: 3
